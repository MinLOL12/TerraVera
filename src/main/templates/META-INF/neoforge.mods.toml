modLoader = "javafml"
loaderVersion = "[4,)"
license = "EUPL-1.2"
issueTrackerURL = "https://github.com/MinLOL12/TerraVera/issues"

[[mods]]
    modId = "${modId}"
    version = "${modVersion}"
    displayName = "TerraVera"
    authors = "MinLOL12"
    description = '''
TerraVera extends TerraFirmaCraft's stone age. Plant fibre must be gathered, retted and twisted into cordage before
any stone tool can be hafted - a knapped head and a bare stick are no longer enough. Knapping itself is unchanged,
and uses TerraFirmaCraft's own knapping screen and recipes.
'''

[[dependencies.${modId}]]
    modId = "tfc"
    type = "required"
    versionRange = "[3.3.0,)"
    ordering = "AFTER"
    side = "BOTH"

[[dependencies.${modId}]]
    modId = "patchouli"
    type = "required"
    versionRange = "${patchouliVersionRange}"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${modId}]]
    modId = "jei"
    type = "optional"
    versionRange = "${jeiVersionRange}"
    ordering = "NONE"
    side = "CLIENT"

[[dependencies.${modId}]]
    modId = "neoforge"
    type = "required"
    versionRange = "${neoForgeVersionRange}"
    ordering = "AFTER"
    side = "BOTH"

[[dependencies.${modId}]]
    modId = "minecraft"
    type = "required"
    versionRange = "${minecraftVersionRange}"
    ordering = "AFTER"
    side = "BOTH"

# Gradle needs a decent chunk of memory to run the Minecraft decompilation / NeoForm process
org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=false
org.gradle.console=plain

# --- TerraFirmaCraft dependency --------------------------------------------------------------
# TerraFirmaCraft is not published to a public Maven repository, so it has to come from either
#   1. CurseForge, via cursemaven (the default), or
#   2. A jar you drop into `libs/` yourself, which always wins over cursemaven if present.
#
# 302973 is the CurseForge project id of TerraFirmaCraft. `tfcCurseFileId` must point at a
# TerraFirmaCraft NeoForge 1.21.1 build - grab the file id out of the CurseForge download URL
# (https://www.curseforge.com/minecraft/mc-mods/terrafirmacraft/files/<fileId>) and set it here.
tfcCurseProjectId=302973
tfcCurseFileId=8467670
org.gradle.java.home=C:\\Program Files\\Eclipse Adoptium\\jdk-21.0.11.10-hotspot
